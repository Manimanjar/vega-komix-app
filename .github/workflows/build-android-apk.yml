name: Build Vega Komix APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Sandbox Runtime
        run: npm run build:sandbox

      - name: Configure Keystore & Compile APK
        shell: bash
        run: |
          set -euo pipefail

          # Generate debug/signing keystore if not present
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug signing keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x android/gradlew
          cd android

          echo "Compiling Android APK with Gradle..."
          if ./gradlew assembleRelease --no-daemon --console=plain --stacktrace; then
            echo "assembleRelease succeeded!"
          else
            echo "assembleRelease failed, falling back to assembleDebug..."
            ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
          fi
          cd ..

      - name: Locate and Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated by Gradle build!" >&2
            exit 1
          fi

          echo "Found generated APK: $APK_PATH"
          cp "$APK_PATH" output/Vega-Komix-v6.1.1.apk
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Komix-v6.1.1-APK
          path: output/Vega-Komix-v6.1.1.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v6.1.1
          name: "Vega Komix v6.1.1 (Maintenance Release - Provider & Image Pipeline Fixes)"
          body: |
            # 🚀 Vega Komix v6.1.1 Maintenance Release

            **Release Date:** November 15, 2026  
            **Build Target:** Android 6.0+ (ARM64 & Universal)  
            **Package:** `com.vegakomix.app` (versionCode: 311)

            ---

            ### 📖 What's New in Vega Komix v6.1.1

            #### 1. 🖼️ Native ExpoImage Pipeline & Zero-Failure Readers
            - Migrated `WebtoonView` from React Native `Animated.Image` to `ExpoImage` with `cachePolicy="memory-disk"`, fixing failed-to-load page errors on CDN-protected images.
            - Migrated `ComicThumbnail` to `ExpoImage` with apex-domain referer derivation, guaranteeing reliable thumbnail rendering across all providers.
            - Replaced desktop User-Agent in preloader and stream headers with native Android Mobile User-Agent to bypass Cloudflare bot challenges.

            #### 2. 🌐 Provider Fixes & Silence Background WAF Popups
            - **NovelCrow:** Suppressed non-interactive Cloudflare WAF WebView popups during background search and aggregation.
            - **AllPornComic:** Fixed thumbnail extraction from lazyload `data-src` / `data-srcset` attributes, restored complete multi-page chapter extraction, and bumped provider version to `v1.1.0`.
            - **ComicsValley:** Updated mobile headers, added fallback search resilience, and bumped provider to `v1.1.0`.
            - Bumped all provider extensions in `manifest.json` to trigger immediate in-app updates.

            ---

            ### 📦 Download & Installation
            Download the signed APK below and install it directly on your Android device:
            - **Vega-Komix-v6.1.1.apk** (ARM64 & Universal)
          files: output/Vega-Komix-v6.1.1.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
