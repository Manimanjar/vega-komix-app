name: Build Vega Komix APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Sandbox Runtime
        run: npm run build:sandbox

      - name: Configure Keystore & Compile APK
        shell: bash
        run: |
          set -euo pipefail

          # Generate debug/signing keystore if not present
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug signing keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x android/gradlew
          cd android

          echo "Compiling Android APK with Gradle..."
          if ./gradlew assembleRelease --no-daemon --console=plain --stacktrace; then
            echo "assembleRelease succeeded!"
          else
            echo "assembleRelease failed, falling back to assembleDebug..."
            ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
          fi
          cd ..

      - name: Extract App Version & Metadata
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Vega Komix v${VERSION} (build ${BUILD})..."

      - name: Locate and Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated by Gradle build!" >&2
            exit 1
          fi

          VERSION="${{ steps.app_version.outputs.version }}"
          TARGET_APK="output/Vega-Komix-v${VERSION}.apk"
          echo "Found generated APK: $APK_PATH -> Packaging to $TARGET_APK"
          cp "$APK_PATH" "$TARGET_APK"
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Komix-v${{ steps.app_version.outputs.version }}-APK
          path: output/Vega-Komix-v${{ steps.app_version.outputs.version }}.apk
          retention-days: 30

      - name: Generate Release Notes from CHANGELOG
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          # Extract section from CHANGELOG.md for current version
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > output/release_notes.md || true

          if [ ! -s output/release_notes.md ]; then
            echo "Vega Komix v${VERSION} release build." > output/release_notes.md
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "Vega Komix v${{ steps.app_version.outputs.version }} (Build ${{ steps.app_version.outputs.build }})"
          body_path: output/release_notes.md
          files: output/Vega-Komix-v${{ steps.app_version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
