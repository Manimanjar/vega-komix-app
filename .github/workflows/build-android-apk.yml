name: Build Vega Komix APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Sandbox Runtime
        run: npm run build:sandbox

      - name: Configure Keystore & Compile APK
        shell: bash
        run: |
          set -euo pipefail

          # Generate debug/signing keystore if not present
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug signing keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x android/gradlew
          cd android

          echo "Compiling Android APK with Gradle..."
          if ./gradlew assembleRelease --no-daemon --console=plain --stacktrace; then
            echo "assembleRelease succeeded!"
          else
            echo "assembleRelease failed, falling back to assembleDebug..."
            ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
          fi
          cd ..

      - name: Locate and Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated by Gradle build!" >&2
            exit 1
          fi

          echo "Found generated APK: $APK_PATH"
          cp "$APK_PATH" output/Vega-Komix-v6.1.0.apk
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Komix-v6.1.0-APK
          path: output/Vega-Komix-v6.1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v6.1.0
          name: "Vega Komix v6.1.0 (Feature Release - Reader HUD & Settings Overhaul)"
          body: |
            # 🚀 Vega Komix v6.1.0 Feature Release

            **Release Date:** November 15, 2026  
            **Build Target:** Android 6.0+ (ARM64 & Universal)  
            **Package:** `com.vegakomix.app` (versionCode: 310)

            ---

            ### 📖 What's New in Vega Komix v6.1.0

            #### 1. 🎛️ Complete Reader HUD & Function Bar Redesign
            - **1-Tap Reading Mode Toggle:** Seamlessly switch between **Continuous** (vertical strip) and **Page by Page** (horizontal swipe) in one tap directly from the top bar.
            - **1-Tap Interaction / Scroll Mode:** Toggle between **Scroll** (natural webpage scrolling), **One Tap** (left/right tap zones), and **Swipe** on the fly with a glowing accent indicator.
            - **Strict 2-State Orientation Lock:** Instant 1-tap toggle between **Portrait** and **Landscape** (fits 100% full screen width without pillar-boxing).
            - **Accurate Page Progress Scrubber:** Replaced raw pixel coordinates with true `Page X / Total` (e.g., `2 / 24`) and dynamic completion percentage.
            - **Streamlined Top Bar:** Removed the intrusive top-right shield button for a distraction-free reading experience.

            #### 2. ⚙️ Redesigned In-Reader Settings Sheet
            - **Pure AMOLED Black (`#000000`):** True black theme across both the comic reader and detail/info screens.
            - **Live Zoom Controller:** Adjust zoom from 50% to 300% with real-time pinch/zoom support.
            - **Image Fit & Aspect Modes:** Choose between Fit Width, Fit Height, or Original size.
            - **Hands-Free Auto-Scroll:** Variable auto-scroll speeds (1x to 4x) with touch-to-pause and auto-resume.
            - **Night Mode & Warm Dimmer Filter:** Adjustable software dimmer overlay for comfortable night reading.
            - **Quick Reader Tools:** Jump to 1st page, reload current page/cache, toggle image quality, and download chapter for offline reading.

            #### 3. 🖼️ Info & Comic Details Polish
            - Removed distracting blurred background thumbnail in `Info.tsx` for 100% crisp, readable synopsis and chapter listings.
            - Added universal Single-Chapter fallback synthesis for single-file gallery and webcomic releases.

            #### 4. 🌐 Provider Improvements & Bug Fixes
            - Removed discontinued/broken providers (`komixGallery`, `webtoonManhwa`).
            - Hardened scrapers for `allporncomics`, `comicsvalley`, and `novelcrow`.
            - Added universal single-file chapter support for WordPress comic galleries.

            ---

            ### 📦 Download & Installation
            Download the signed APK below and install it directly on your Android device:
            - **Vega-Komix-v6.1.0.apk** (ARM64 & Universal)
          files: output/Vega-Komix-v6.1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
