name: Build Vega Komix APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Sandbox Runtime
        run: npm run build:sandbox

      - name: Configure Keystore & Compile APK
        shell: bash
        run: |
          set -euo pipefail

          # Generate debug/signing keystore if not present
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug signing keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x android/gradlew
          cd android

          echo "Compiling Android APK with Gradle..."
          if ./gradlew assembleRelease --no-daemon --console=plain --stacktrace; then
            echo "assembleRelease succeeded!"
          else
            echo "assembleRelease failed, falling back to assembleDebug..."
            ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
          fi
          cd ..

      - name: Locate and Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated by Gradle build!" >&2
            exit 1
          fi

          echo "Found generated APK: $APK_PATH"
          cp "$APK_PATH" output/Vega-Komix-v5.3.3.apk
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Komix-APK
          path: output/Vega-Komix-v5.3.3.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v5.3.3
          name: "Vega Komix v5.3.3 (Android Release)"
          body: |
            ## Vega Komix v5.3.3 Release APK
            
            Native high-performance Comic, Manga, Manhwa, and Doujinshi reader app.
            
            ### Highlights & Features:
            - **4 Native Reading Modes:** Webtoon (continuous vertical strip), Manga (RTL), Comic (LTR), and Double Spread (landscape side-by-side).
            - **Offline-First CBZ Downloader:** Parallel chapter image downloader, export to `.cbz` comic archives, and import local `.cbz` files.
            - **Live Zero-Key Uncensored Translator:** Offline/off-thread OCR with spatial bubble clustering (Japanese vertical RTL columns + Korean/Western rows) and zero-key uncensored AI literary translation with instant neural failover.
            - **Instant 0ms Stale-While-Revalidate Engine:** Cached card feeds and touch-down speculative prefetching.
            - **High-Res 2:3 Cover Pipeline:** Anti-hotlink header injection, dynamic resolution upgrading, and 2:3 vertical aspect ratio.
            - **Turbo 8-Page Preloader & OOM Bitmap Guard:** Sliding-window preloading with bitmap memory unmounting outside active reading viewports.
            - **Auto Domain Resolver:** 4-stage automatic TLD rotation resolver (`.to`, `.net`, `.org`, `.cc`, etc.).
            - **Production Providers:** MangaDex, Komix Gallery, and Webtoon & Manhwa pre-configured out of the box.
          files: output/Vega-Komix-v5.3.3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
