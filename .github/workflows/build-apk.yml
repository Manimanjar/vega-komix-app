name: Build Vega Komix APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Sandbox Runtime
        run: npm run build:sandbox

      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
          cd ..

      - name: Locate and Rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK generated!" >&2
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output/Vega-Komix-v5.3.3.apk
          ls -la output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Komix-APK
          path: output/Vega-Komix-v5.3.3.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v5.3.3
          name: "Vega Komix v5.3.3 APK"
          body: |
            ### Vega Komix v5.3.3
            - Native high-res Comic, Manga, Manhwa, and Doujinshi reader app.
            - Continuous vertical Webtoon strip, Manga RTL, Western Comic LTR, and Landscape Double-Page Spreads.
            - Parallel Chapter Image Downloader & `.cbz` archive packaging/importing.
            - Automatic 4-stage TLD & Domain Rotation Resolver.
            - "Single Room" scattered chapter collector & feed de-duplicator.
            - WAF WebView bypass, Cloudflare WARP, and ByeDPI intact.
          files: output/Vega-Komix-v5.3.3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
